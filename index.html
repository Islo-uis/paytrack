<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayTrack PH</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">₱</div>
      <div>
        <strong>PayTrack PH</strong>
        <small id="bizLabel">Demo Business</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-page="scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8V6a2 2 0 0 1 2-2h2"/><path d="M17 4h2a2 2 0 0 1 2 2v2"/><path d="M21 16v2a2 2 0 0 1-2 2h-2"/><path d="M7 20H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></svg>
        <span>Scan Receipt</span>
      </button>
      <button class="nav-item" data-page="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
        <span>Transactions</span>
      </button>
      <button class="nav-item" data-page="reconciliation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M21 3v6h-6"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Reconciliation</span>
      </button>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
    <div class="sb-foot">
      <strong>Prototype build</strong>
      <span>Data in this browser only. AI runs via Google Gemini.</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
      </button>
      <div class="tb-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Overview</p>
      </div>
      <button class="icon-btn" id="notifBtn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot" id="notifDot" hidden></span>
      </button>
      <div class="profile" id="profileBtn">
        <span class="avatar" id="avatar">JD</span>
        <span class="pm">
          <strong id="pName">Jamie Dela Cruz</strong>
          <small id="pRole">Cashier</small>
        </span>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="toasts"></div>
<div id="modalRoot"></div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/camera.js"></script>
<script src="js/gemini.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/receipt.js"></script>
<script src="js/transactions.js"></script>
<script src="js/reconciliation.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
